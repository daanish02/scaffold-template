name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  ensure-pages-enabled:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages (build via Actions) if not already set up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1 || \
          gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow
  deploy:
    needs: ensure-pages-enabled
    uses: daanish02/scaffold-core/.github/workflows/deploy-pages.yml@main
